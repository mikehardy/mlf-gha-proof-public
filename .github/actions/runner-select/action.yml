name: Mellifera runner select
description: >-
  Applies the Mellifera GHA placement pool test and outputs the runs-on label JSON
  for the job (hosted default, overflow spill, or safe default on failure).
inputs:
  mode:
    description: off, fixed, or github-app
    required: true
  default-runs-on:
    description: Hosted label string or JSON array of labels
    required: true
  class:
    description: macos or other
    required: true
  placement-url:
    description: Full GET URL for /v1/gha/placement (repo and label query included)
    required: false
  placement-token:
    description: Bearer token for placement (never logged)
    required: false
  placement-ca:
    description: >-
      Optional PEM text of the CA that signs the placement host certificate. Pass it
      from a configuration variable (vars.MELLIFERA_PLACEMENT_CA), not a secret. When
      set, curl trusts only this CA; empty keeps system trust. Never logged.
    required: false
    default: ''
  overflow-runs-on:
    description: Overflow label string or JSON array when headroom allows spill
    required: true
outputs:
  runs-on:
    description: JSON string or array for fromJSON() in the workflow
    value: ${{ steps.select.outputs.runs-on }}
  pool:
    description: hosted, overflow, or default
    value: ${{ steps.select.outputs.pool }}
  reason:
    description: off, hosted, overflow, default, or error
    value: ${{ steps.select.outputs.reason }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_DEFAULT_RUNS_ON: ${{ inputs.default-runs-on }}
        INPUT_CLASS: ${{ inputs.class }}
        INPUT_PLACEMENT_URL: ${{ inputs.placement-url }}
        INPUT_PLACEMENT_TOKEN: ${{ inputs.placement-token }}
        INPUT_PLACEMENT_CA: ${{ inputs.placement-ca }}
        INPUT_OVERFLOW_RUNS_ON: ${{ inputs.overflow-runs-on }}
      run: |
        set -euo pipefail
        mapfile -t _lines < <(bash "${{ github.action_path }}/select.sh")
        for _line in "${_lines[@]}"; do
          echo "$_line" >> "$GITHUB_OUTPUT"
        done