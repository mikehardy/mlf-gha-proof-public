# P-G0: hosted curl to global /health (no CA vs placement CA) + runner-select mode off.
name: proof-reachability
on:
  workflow_dispatch:
jobs:
  reachability:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: health without CA (expect TLS failure)
        id: no_ca
        continue-on-error: true
        env:
          BASE: ${{ vars.MELLIFERA_GLOBAL_URL }}
        run: |
          set +e
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 "${BASE}/health" 2>/tmp/curl-no-ca.err)
          rc=$?
          set -e
          echo "http_code=${code}"
          echo "curl_rc=${rc}"
          if [[ "$rc" -eq 0 && "$code" == "200" ]]; then
            echo "UNEXPECTED: no-CA curl succeeded with 200" >&2
            exit 1
          fi
          echo "no_ca_ok=1" >> "$GITHUB_OUTPUT"
          echo "no_ca_result=tls_or_fail_as_expected code=${code} rc=${rc}"
      - name: health with placement CA (expect 200)
        id: with_ca
        env:
          BASE: ${{ vars.MELLIFERA_GLOBAL_URL }}
          MELLIFERA_PLACEMENT_CA: ${{ vars.MELLIFERA_PLACEMENT_CA }}
        run: |
          set -euo pipefail
          ca=$(mktemp)
          printf '%s\n' "$MELLIFERA_PLACEMENT_CA" > "$ca"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert "$ca" --connect-timeout 15 --max-time 30 "${BASE}/health")
          rm -f "$ca"
          echo "http_code=${code}"
          [[ "$code" == "200" ]]
          echo "with_ca_ok=1" >> "$GITHUB_OUTPUT"
      - name: runner-select mode off
        id: sel
        uses: ./.github/actions/runner-select
        with:
          mode: ${{ vars.RUNNER_SELECT_MODE }}
          default-runs-on: ubuntu-24.04
          class: linux
          placement-ca: ${{ vars.MELLIFERA_PLACEMENT_CA }}
          overflow-runs-on: linux-self-hosted
      - name: summarize codes only
        run: |
          echo "no_ca=${{ steps.no_ca.outputs.no_ca_ok }}"
          echo "with_ca=ok"
          echo "pool=${{ steps.sel.outputs.pool }} reason=${{ steps.sel.outputs.reason }}"
          [[ "${{ steps.sel.outputs.reason }}" == "off" ]]
